<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Batch WebP FFmpeg Converter</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-8 font-sans">
  <div class="max-w-3xl mx-auto space-y-6">
    
    <!-- Header -->
    <div class="border-b border-slate-800 pb-4">
      <h1 class="text-2xl font-bold tracking-tight text-white">Batch WebP Converter</h1>
      <p class="text-sm text-slate-400 mt-1 font-mono bg-slate-800/50 p-2 rounded border border-slate-700/50 inline-block">
        ffmpeg -i input.webp -vf "scale=683:384,crop=640:384" -c:v libwebp -loop 0 -q:v 88 output.webp
      </p>
    </div>

    <!-- Drop Zone -->
    <div id="dropZone" class="border-2 border-dashed border-slate-700 hover:border-indigo-500 rounded-xl p-8 text-center transition-colors cursor-pointer bg-slate-800/20">
      <input type="file" id="fileInput" multiple accept=".webp,image/webp" class="hidden" />
      <div class="space-y-2">
        <svg class="mx-auto h-12 w-12 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
        <p class="text-base font-medium">Click to select or drag & drop WebP files here</p>
        <p class="text-xs text-slate-500">Supports multiple files for batch processing</p>
      </div>
    </div>

    <!-- Actions -->
    <div class="flex items-center justify-between">
      <div class="text-sm text-slate-400">
        Selected: <span id="fileCount" class="font-bold text-white">0</span> files
      </div>
      <div class="space-x-3">
        <button id="convertBtn" disabled class="bg-indigo-600 hover:bg-indigo-500 disabled:bg-slate-800 disabled:text-slate-600 text-white font-medium px-5 py-2.5 rounded-lg transition shadow-lg shadow-indigo-600/20">
          Start Batch Conversion
        </button>
        <button id="downloadAllBtn" class="hidden bg-emerald-600 hover:bg-emerald-500 text-white font-medium px-5 py-2.5 rounded-lg transition shadow-lg shadow-emerald-600/20">
          Download All (ZIP)
        </button>
      </div>
    </div>

    <!-- File List -->
    <div id="fileList" class="space-y-2 max-h-60 overflow-y-auto pr-1"></div>

    <!-- Terminal/Log Output -->
    <div class="space-y-2">
      <label class="text-xs font-semibold text-slate-400 uppercase tracking-wider">FFmpeg Engine Log</label>
      <div id="logOutput" class="bg-black/80 border border-slate-800 rounded-lg p-3 font-mono text-xs text-slate-400 h-40 overflow-y-auto space-y-1">
        <div>[System] Ready. Please load WebP files to begin.</div>
      </div>
    </div>

  </div>

  <script type="module">
    import { FFmpeg } from 'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/+esm';
    import { fetchFile, toBlobURL } from 'https://cdn.jsdelivr.net/npm/@ffmpeg/util@0.12.1/+esm';

    let ffmpeg = null;
    let selectedFiles = [];
    let convertedFiles = [];

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const convertBtn = document.getElementById('convertBtn');
    const downloadAllBtn = document.getElementById('downloadAllBtn');
    const fileList = document.getElementById('fileList');
    const fileCount = document.getElementById('fileCount');
    const logOutput = document.getElementById('logOutput');

    function log(message, isError = false) {
      const line = document.createElement('div');
      line.className = isError ? 'text-red-400 font-bold' : 'text-slate-300';
      line.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
      logOutput.appendChild(line);
      logOutput.scrollTop = logOutput.scrollHeight;
    }

    // Initialize FFmpeg with Blob URL CORS Workaround
    async function loadFFmpeg() {
      if (ffmpeg) return;
      ffmpeg = new FFmpeg();
      
      ffmpeg.on('log', ({ message }) => {
        log(message);
      });

      log("Loading FFmpeg WebAssembly engine (converting CDN scripts to Same-Origin Blobs)...");
      try {
        const baseURL = 'https://unpkg.com/@ffmpeg/core@0.12.6/dist/esm';
        const ffmpegURL = 'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/esm';
        
        // Using toBlobURL bypasses GitHub Pages / CDN cross-origin Worker blocks
        await ffmpeg.load({
          coreURL: await toBlobURL(`${baseURL}/ffmpeg-core.js`, 'text/javascript'),
          wasmURL: await toBlobURL(`${baseURL}/ffmpeg-core.wasm`, 'application/wasm'),
          classWorkerURL: await toBlobURL(`${ffmpegURL}/worker.js`, 'text/javascript'),
        });
        
        log("FFmpeg engine successfully loaded and ready.");
      } catch (err) {
        log(`Failed to load FFmpeg: ${err.message}`, true);
        alert("Could not load FFmpeg WebAssembly. Check console or network connection.");
      }
    }

    // UI File Handling
    function updateFileList() {
      fileList.innerHTML = '';
      fileCount.textContent = selectedFiles.length;
      convertBtn.disabled = selectedFiles.length === 0;
      downloadAllBtn.classList.add('hidden');
      convertedFiles = [];

      selectedFiles.forEach((file, index) => {
        const item = document.createElement('div');
        item.id = `file-${index}`;
        item.className = "flex items-center justify-between bg-slate-800/50 border border-slate-800 px-4 py-2.5 rounded-lg text-sm";
        item.innerHTML = `
          <span class="font-mono truncate max-w-xs text-slate-300">${file.name}</span>
          <span id="status-${index}" class="text-xs font-semibold px-2 py-1 bg-slate-700 text-slate-300 rounded">Pending</span>
        `;
        fileList.appendChild(item);
      });
    }

    function setStatus(index, status, type = 'normal') {
      const badge = document.getElementById(`status-${index}`);
      if (!badge) return;
      badge.textContent = status;
      badge.className = "text-xs font-semibold px-2 py-1 rounded ";
      if (type === 'processing') badge.className += "bg-amber-500/20 text-amber-300 border border-amber-500/30 animate-pulse";
      else if (type === 'success') badge.className += "bg-emerald-500/20 text-emerald-300 border border-emerald-500/30";
      else if (type === 'error') badge.className += "bg-red-500/20 text-red-300 border border-red-500/30";
      else badge.className += "bg-slate-700 text-slate-300";
    }

    // Drag and Drop Events
    dropZone.addEventListener('click', () => fileInput.click());
    dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('border-indigo-500', 'bg-slate-800/50'); });
    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('border-indigo-500', 'bg-slate-800/50'));
    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('border-indigo-500', 'bg-slate-800/50');
      selectedFiles = Array.from(e.dataTransfer.files).filter(f => f.name.toLowerCase().endsWith('.webp'));
      updateFileList();
    });
    fileInput.addEventListener('change', (e) => {
      selectedFiles = Array.from(e.target.files);
      updateFileList();
    });

    // Batch Conversion Logic
    convertBtn.addEventListener('click', async () => {
      convertBtn.disabled = true;
      await loadFFmpeg();

      for (let i = 0; i < selectedFiles.length; i++) {
        const file = selectedFiles[i];
        setStatus(i, 'Converting...', 'processing');
        log(`Starting conversion for: ${file.name}`);

        const safeInput = `input_${i}.webp`;
        const safeOutput = `output_${i}.webp`;

        try {
          await ffmpeg.writeFile(safeInput, await fetchFile(file));

          const exitCode = await ffmpeg.exec([
            '-i', safeInput,
            '-vf', 'scale=683:384,crop=640:384',
            '-c:v', 'libwebp',
            '-loop', '0',
            '-q:v', '88',
            safeOutput
          ]);

          if (exitCode !== 0) throw new Error(`FFmpeg exited with code ${exitCode}`);

          const data = await ffmpeg.readFile(safeOutput);
          const blob = new Blob([data.buffer], { type: 'image/webp' });
          
          convertedFiles.push({ name: file.name, blob: blob });

          await ffmpeg.deleteFile(safeInput);
          await ffmpeg.deleteFile(safeOutput);

          setStatus(i, 'Done', 'success');
          log(`Successfully converted: ${file.name}`);

          const item = document.getElementById(`file-${i}`);
          const url = URL.createObjectURL(blob);
          const dlBtn = document.createElement('a');
          dlBtn.href = url;
          dlBtn.download = file.name;
          dlBtn.textContent = "Download";
          dlBtn.className = "ml-3 text-xs text-indigo-400 hover:text-indigo-300 underline font-semibold";
          item.appendChild(dlBtn);

        } catch (err) {
          setStatus(i, 'Error', 'error');
          log(`Error converting ${file.name}: ${err.message}`, true);
        }
      }

      if (convertedFiles.length > 0) {
        downloadAllBtn.classList.remove('hidden');
        log("Batch processing complete! You can download files individually or as a ZIP.");
      }
      convertBtn.disabled = false;
    });

    // ZIP Download Logic
    downloadAllBtn.addEventListener('click', async () => {
      log("Generating ZIP archive...");
      const zip = new JSZip();
      
      convertedFiles.forEach(file => {
        zip.file(file.name, file.blob);
      });

      const content = await zip.generateAsync({ type: "blob" });
      const url = URL.createObjectURL(content);
      const a = document.createElement('a');
      a.href = url;
      a.download = "converted_webp_batch.zip";
      a.click();
      URL.createObjectURL(url);
      log("ZIP archive downloaded.");
    });
  </script>
</body>
</html>
