<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evidence Viewer</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Inter:wght@400;500&display=swap');
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --green:#00c832;--green-dim:#007a1e;--green-dark:#004d12;
  --black:#070b08;--panel:#0c1210;--panel2:#101a12;
  --border:#18301e;--border2:#00c83233;
  --text:#c0ecc8;--text-dim:#4a7a54;
  --mono:'Share Tech Mono',monospace;--sans:'Inter',sans-serif;
}
html,body{width:100%;height:100%;background:var(--black);color:var(--text);font-family:var(--sans);overflow:hidden;user-select:none}
#app{display:grid;grid-template-rows:48px 1fr 130px;height:100vh;width:100vw}

/* TOP BAR */
#topbar{display:flex;align-items:center;padding:0 16px;gap:10px;background:var(--panel);border-bottom:1px solid var(--border)}
.logo{font-family:var(--mono);font-size:12px;color:var(--green);letter-spacing:.12em;white-space:nowrap}
#item-title{font-family:var(--mono);font-size:14px;color:var(--green);letter-spacing:.05em;flex:1;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#item-index{font-family:var(--mono);font-size:10px;color:var(--text-dim);min-width:48px;text-align:right}
.tbtn{background:var(--panel2);border:1px solid var(--border);color:var(--text-dim);font-family:var(--mono);font-size:10px;padding:4px 9px;cursor:pointer;border-radius:2px;letter-spacing:.04em;transition:all .15s;white-space:nowrap}
.tbtn:hover{border-color:var(--green-dim);color:var(--green)}
.tbtn.on{border-color:var(--green);color:var(--green)}

.hbtn.on{border-color:var(--green);color:var(--green)}

/* empty */
#empty{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;pointer-events:none}
#empty .ei{width:56px;height:56px;border:1px solid var(--green-dim);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:24px;color:var(--green-dim);font-family:var(--mono)}
#empty h2{font-family:var(--mono);font-size:12px;color:var(--text-dim);letter-spacing:.1em}
#empty p{font-family:var(--mono);font-size:10px;color:#1a3020;text-align:center;max-width:240px;line-height:1.9}

/* BOTTOM NAV */
#bottom{background:var(--panel);border-top:1px solid var(--border);padding:8px 12px 10px;display:flex;flex-direction:column;gap:6px}
#nav-label{font-family:var(--mono);font-size:9px;color:var(--text-dim);letter-spacing:.12em;text-transform:uppercase}
#nav-row{display:flex;align-items:center;gap:6px}
.narr{background:var(--panel2);border:1px solid var(--border);color:var(--text-dim);font-size:18px;width:30px;height:68px;cursor:pointer;border-radius:2px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;font-family:var(--mono)}
.narr:hover{border-color:var(--green-dim);color:var(--green)}
#strip{display:flex;gap:6px;overflow-x:auto;flex:1;padding-bottom:2px;scrollbar-width:thin;scrollbar-color:var(--green-dim) transparent}
.thumb{flex-shrink:0;width:68px;height:68px;background:var(--panel2);border:1px solid var(--border);border-radius:3px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;position:relative;transition:all .15s;overflow:hidden}
.thumb:hover{border-color:var(--green-dim)}
.thumb.active{border-color:var(--green);background:#0a1f10}
.th-img{width:48px;height:48px;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(0 0 3px #00c83244)}
.th-img.err{display:none}
.th-fallback{font-size:20px;color:var(--border);font-family:var(--mono);display:none}
.thumb.active .th-fallback{color:var(--green-dim)}
.th-lbl{font-family:var(--mono);font-size:8px;color:var(--text-dim);text-align:center;padding:0 3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:64px}
.thumb.active .th-lbl{color:var(--green)}
.th-num{position:absolute;top:2px;left:4px;font-family:var(--mono);font-size:8px;color:var(--text-dim)}
.th-status{position:absolute;top:2px;right:4px;font-family:var(--mono);font-size:8px;color:var(--text-dim)}
.th-status.ok{color:var(--green-dim)}
.th-status.err{color:#7a2020}

/* status tooltip */
#status-tip{position:absolute;bottom:136px;left:50%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--border);font-family:var(--mono);font-size:10px;color:var(--text-dim);padding:4px 10px;border-radius:2px;z-index:20;pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .2s}
#status-tip.show{opacity:1}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="logo">◈ EVIDENCE</div>
    <div id="item-title">— select an item —</div>
    <div id="item-index">— / —</div>
    <button class="tbtn" id="btn-reset">⟳ Camera</button>
    <button class="tbtn" id="btn-wire">Wireframe</button>
    <button class="tbtn" id="btn-auto">Auto-rotate</button>
  </div>

  <div id="cv-wrap">
    <canvas id="glcanvas"></canvas>
    <div id="loading-bar"></div>
    <div id="hud-tl">
      <div>left-drag ·· rotate</div>
      <div>right-drag ·· pan</div>
      <div>scroll ·· zoom</div>
      <div>← → keys ·· switch</div>
    </div>
    <div id="empty">
      <div class="ei">◈</div>
      <h2>NO EVIDENCE LOADED</h2>
      <p>Select an item from the strip below.<br>Items load from the configured GitHub repo paths.</p>
    </div>
  </div>

  <div id="bottom">
    <div id="nav-label">Evidence Items</div>
    <div id="nav-row">
      <button class="narr" id="nav-prev">‹</button>
      <div id="strip"></div>
      <button class="narr" id="nav-next">›</button>
    </div>
  </div>
</div>
<div id="status-tip"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ─────────────────────────────────────────────
//  ITEM LIST — edit these to match your repo
//  Raw base: https://raw.githubusercontent.com/Trite699/<repo>/main/
// ─────────────────────────────────────────────
const RAW = 'https://raw.githubusercontent.com/Trite699/Testing/main/';

const ITEMS = [
  {
    name: 'Attorney's Badge',
    obj:  RAW + 'models/Badge/Attorney's Badge.obj',
    mtl:  RAW + 'models/Badge/Attorney's Badge.mtl',   // set null if none
    icon: RAW + 'icons/Attorney's Badge.png',
  },
  // ── ADD MORE ITEMS HERE ───────────────────
  // {
  //   name: 'My Item',
  //   obj:  RAW + 'models/myitem/myitem.obj',
  //   mtl:  RAW + 'models/myitem/myitem.mtl',
  //   icon: RAW + 'icons/myitem.png',
  // },
];
// ─────────────────────────────────────────────

let scene, camera, renderer, mesh = null;
let rotX = 0.3, rotY = 0.5, panX = 0, panY = 0, zoom = 5;
let drag = false, rightDrag = false, lx = 0, ly = 0;
let autoRot = false, wireMod = false;
let activeIdx = -1;
const loadedCache = {}; // url → THREE.Group

function initThree() {
  const wrap = document.getElementById('cv-wrap');
  renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('glcanvas'), antialias: true, alpha: true });
  renderer.setPixelRatio(devicePixelRatio);
  doResize();
  scene = new THREE.Scene();
  camera = new THREE.PerspectiveCamera(45, 1, 0.01, 1000);
  scene.add(new THREE.AmbientLight(0x88ffaa, 0.5));
  const d1 = new THREE.DirectionalLight(0xffffff, 1.0); d1.position.set(3,5,3); scene.add(d1);
  const d2 = new THREE.DirectionalLight(0x00ff44, 0.25); d2.position.set(-3,-2,-3); scene.add(d2);
  window.addEventListener('resize', doResize);
  setupControls();
  (function loop(){ requestAnimationFrame(loop); if(autoRot && mesh) rotY += 0.008; updateCam(); renderer.render(scene,camera); })();
}

function doResize() {
  const w = document.getElementById('cv-wrap'), W = w.clientWidth, H = w.clientHeight;
  renderer.setSize(W, H);
  if (camera) { camera.aspect = W/H; camera.updateProjectionMatrix(); }
}

function updateCam() {
  camera.position.set(
    Math.sin(rotY)*Math.cos(rotX)*zoom + panX,
    Math.sin(rotX)*zoom + panY,
    Math.cos(rotY)*Math.cos(rotX)*zoom
  );
  camera.lookAt(panX, panY, 0);
}

function setupControls() {
  const cv = document.getElementById('glcanvas');
  cv.addEventListener('mousedown', e=>{ drag=true; rightDrag=e.button===2; lx=e.clientX; ly=e.clientY; });
  cv.addEventListener('contextmenu', e=>e.preventDefault());
  window.addEventListener('mousemove', e=>{ if(!drag) return; const dx=e.clientX-lx, dy=e.clientY-ly; lx=e.clientX; ly=e.clientY;
    if(rightDrag){ panX-=dx*.003*zoom/5; panY+=dy*.003*zoom/5; } else { rotY+=dx*.008; rotX=Math.max(-1.5,Math.min(1.5,rotX-dy*.008)); } });
  window.addEventListener('mouseup', ()=>drag=false);
  cv.addEventListener('wheel', e=>{ zoom=Math.max(.5,Math.min(60,zoom+e.deltaY*.01)); e.preventDefault(); },{passive:false});
  let ptd=0;
  cv.addEventListener('touchstart', e=>{ if(e.touches.length===1){drag=true;lx=e.touches[0].clientX;ly=e.touches[0].clientY;}
    if(e.touches.length===2) ptd=Math.hypot(e.touches[1].clientX-e.touches[0].clientX,e.touches[1].clientY-e.touches[0].clientY);
    e.preventDefault(); },{passive:false});
  cv.addEventListener('touchmove', e=>{ if(e.touches.length===1&&drag){const dx=e.touches[0].clientX-lx,dy=e.touches[0].clientY-ly;lx=e.touches[0].clientX;ly=e.touches[0].clientY;rotY+=dx*.008;rotX=Math.max(-1.5,Math.min(1.5,rotX-dy*.008));}
    if(e.touches.length===2){const d=Math.hypot(e.touches[1].clientX-e.touches[0].clientX,e.touches[1].clientY-e.touches[0].clientY);zoom=Math.max(.5,Math.min(60,zoom-(d-ptd)*.05));ptd=d;}
    e.preventDefault(); },{passive:false});
  cv.addEventListener('touchend', ()=>drag=false);
}

// ── Fetch helpers ──
async function fetchText(url) {
  const r = await fetch(url); if(!r.ok) throw new Error(r.status+' '+url); return r.text();
}

// ── MTL parse (textures relative to same folder) ──
async function parseMTL(mtlUrl) {
  const text = await fetchText(mtlUrl);
  const base = mtlUrl.substring(0, mtlUrl.lastIndexOf('/') + 1);
  const mats = {}; let cur = null;
  for (const raw of text.split('\n')) {
    const line = raw.trim();
    if (line.startsWith('newmtl ')) { cur = line.slice(7).trim(); mats[cur] = {}; continue; }
    if (!cur) continue;
    const [key, ...rest] = line.split(/\s+/); const val = rest.join(' ');
    if (key === 'Kd') { const [r,g,b] = rest.map(Number); mats[cur].color = new THREE.Color(r,g,b); }
    if (key === 'map_Kd' || key === 'map_kd') {
      const fname = val.split(/[\/\]/).pop();
      mats[cur].map = new THREE.TextureLoader().load(base + fname);
    }
    if (key === 'd') mats[cur].opacity = parseFloat(val);
    if (key === 'Ns') mats[cur].shininess = parseFloat(val);
  }
  return mats;
}

// ── OBJ parse ──
function parseOBJ(text, mtlMats) {
  const vp=[], vn=[], vt=[], groups={};
  let cur = '__default__';
  for (const raw of text.split('\n')) {
    const line = raw.trim(); if(!line||line[0]==='#') continue;
    const [cmd,...args] = line.split(/\s+/);
    if (cmd==='v')  vp.push(args.map(Number));
    else if (cmd==='vn') vn.push(args.map(Number));
    else if (cmd==='vt') vt.push(args.map(Number));
    else if (cmd==='usemtl') cur = args[0]||'__default__';
    else if (cmd==='f') {
      if (!groups[cur]) groups[cur]=[];
      const face = args.map(a=>{ const [pi,ui,ni]=a.split('/').map(x=>x?parseInt(x):0);
        return {p:pi>0?pi-1:vp.length+pi, u:ui>0?ui-1:-1, n:ni>0?ni-1:-1}; });
      for (let i=1;i<face.length-1;i++) groups[cur].push(face[0],face[i],face[i+1]);
    }
  }
  const grp = new THREE.Group();
  for (const [mname, verts] of Object.entries(groups)) {
    if (!verts.length) continue;
    const geo = new THREE.BufferGeometry();
    const pos=[], nor=[], uv2=[];
    for (const v of verts) {
      pos.push(...(vp[v.p]||[0,0,0]));
      nor.push(...(vn[v.n]||[0,1,0]));
      const u = vt[v.u]||[0,0]; uv2.push(u[0],1-u[1]);
    }
    geo.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
    geo.setAttribute('normal',   new THREE.Float32BufferAttribute(nor,3));
    geo.setAttribute('uv',       new THREE.Float32BufferAttribute(uv2,2));
    if (!vn.length) geo.computeVertexNormals();
    const md = (mtlMats&&mtlMats[mname])||{};
    const mat = new THREE.MeshPhongMaterial({
      color: md.color||new THREE.Color(0x44aa66),
      map: md.map||null,
      transparent: md.opacity!==undefined&&md.opacity<1,
      opacity: md.opacity!==undefined?md.opacity:1,
      shininess: md.shininess||30,
      side: THREE.DoubleSide,
    });
    grp.add(new THREE.Mesh(geo,mat));
  }
  const grid = new THREE.GridHelper(10,20,0x003a10,0x002208); grid.position.y=-1.6; grp.add(grid);
  return grp;
}

// ── Load item ──
setBar(0);
async function loadItem(idx) {
  const item = ITEMS[idx];
  setBar(0.08);
  setTip('Loading ' + item.name + '...');

  let mtlMats = null;
  if (item.mtl) {
    try { mtlMats = await parseMTL(item.mtl); setBar(0.4); }
    catch(e) { console.warn('MTL failed', e); setBar(0.4); }
  } else { setBar(0.4); }

  let grp;
  try {
    const objText = await fetchText(item.obj); setBar(0.7);
    grp = parseOBJ(objText, mtlMats); setBar(0.88);
  } catch(e) {
    setTip('Error loading ' + item.name + ': ' + e.message, true);
    setBar(0); return;
  }

  if (mesh) scene.remove(mesh);
  const box = new THREE.Box3().setFromObject(grp);
  const ctr = box.getCenter(new THREE.Vector3());
  const sz = box.getSize(new THREE.Vector3());
  const sc = 3/Math.max(sz.x,sz.y,sz.z,0.001);
  grp.scale.setScalar(sc); grp.position.sub(ctr.multiplyScalar(sc));
  mesh = grp; scene.add(grp);

  rotX=0.3; rotY=0.5; panX=0; panY=0; zoom=5;
  if(wireMod) applyWire(true);

  document.getElementById('empty').style.display='none';
  document.getElementById('item-title').textContent = item.name;
  document.getElementById('item-index').textContent = (idx+1)+' / '+ITEMS.length;
  setBar(1); setTimeout(()=>setBar(0),400);
  setTip(item.name + ' loaded', false, true);
}

function setBar(v) { document.getElementById('loading-bar').style.width=(v*100)+'%'; }
const tipEl = document.getElementById('status-tip');
let tipTimer;
function setTip(msg, isErr=false, autoHide=false) {
  tipEl.textContent = msg;
  tipEl.style.color = isErr ? '#c04040' : 'var(--text-dim)';
  tipEl.classList.add('show');
  clearTimeout(tipTimer);
  if (autoHide) tipTimer = setTimeout(()=>tipEl.classList.remove('show'), 1800);
}

function applyWire(on) {
  if(!mesh) return;
  mesh.traverse(c=>{ if(c.isMesh&&c.material){ const ms=Array.isArray(c.material)?c.material:[c.material]; ms.forEach(m=>m.wireframe=on); }});
}

// ── Build strip ──
function buildStrip() {
  const strip = document.getElementById('strip');
  strip.innerHTML = '';
  ITEMS.forEach((item, i) => {
    const th = document.createElement('div');
    th.className = 'thumb' + (i===activeIdx?' active':'');
    th.innerHTML = `
      <span class="th-num">#${i+1}</span>
      <img class="th-img" src="${esc(item.icon)}" alt="" draggable="false">
      <span class="th-fallback">◈</span>
      <span class="th-lbl">${esc(item.name)}</span>
    `;
    const img = th.querySelector('.th-img');
    const fb  = th.querySelector('.th-fallback');
    img.addEventListener('error', () => { img.classList.add('err'); fb.style.display = 'block'; });
    th.addEventListener('click', () => { if(i!==activeIdx){ activeIdx=i; selectItem(i); } });
    strip.appendChild(th);
  });
}

function selectItem(i) {
  activeIdx = i;
  document.querySelectorAll('.thumb').forEach((el,j)=>el.classList.toggle('active',j===i));
  document.getElementById('strip').children[i]?.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'});
  loadItem(i);
}

function esc(s){ return s.replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Controls ──
document.getElementById('btn-reset').addEventListener('click',()=>{ rotX=0.3;rotY=0.5;panX=0;panY=0;zoom=5; });
document.getElementById('btn-wire').addEventListener('click',function(){ wireMod=!wireMod; this.classList.toggle('on',wireMod); this.textContent=wireMod?'Solid':'Wireframe'; applyWire(wireMod); });
document.getElementById('btn-auto').addEventListener('click',function(){ autoRot=!autoRot; this.classList.toggle('on',autoRot); this.textContent=autoRot?'Stop rotate':'Auto-rotate'; });
document.getElementById('nav-prev').addEventListener('click',()=>{ if(!ITEMS.length) return; selectItem((activeIdx-1+ITEMS.length)%ITEMS.length); });
document.getElementById('nav-next').addEventListener('click',()=>{ if(!ITEMS.length) return; selectItem((activeIdx+1)%ITEMS.length); });
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowLeft') document.getElementById('nav-prev').click();
  if(e.key==='ArrowRight') document.getElementById('nav-next').click();
});

initThree();
buildStrip();
// auto-load first item on open
if (ITEMS.length) { activeIdx=0; selectItem(0); }
</script>
</body>
</html>
