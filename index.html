<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>3D Model Viewer</title>

<style>
body{
margin:0;
overflow:hidden;
background:#222;
}
</style>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/FBXLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/OBJLoader.js"></script>

</head>

<body>

<script>

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x222222);

const camera = new THREE.PerspectiveCamera(
75,
window.innerWidth/window.innerHeight,
0.1,
1000
);

camera.position.set(0,2,5);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth,window.innerHeight);

document.body.appendChild(renderer.domElement);

const controls = new THREE.OrbitControls(camera,renderer.domElement);

scene.add(new THREE.AmbientLight(0xffffff,0.6));

const light = new THREE.DirectionalLight(0xffffff,1);
light.position.set(5,10,7);
scene.add(light);


const modelPath = "PhoenixDef.glb";


function loadModel(path){

const ext = path.split('.').pop().toLowerCase();

if(ext==="glb" || ext==="gltf"){

const loader = new THREE.GLTFLoader();

loader.load(path,function(gltf){
scene.add(gltf.scene);
});

}

else if(ext==="fbx"){

const loader = new THREE.FBXLoader();

loader.load(path,function(obj){
scene.add(obj);
});

}

else if(ext==="obj"){

const loader = new THREE.OBJLoader();

loader.load(path,function(obj){
scene.add(obj);
});

}

else{

console.log("Unsupported format");

}

}

loadModel(modelPath);


function animate(){

requestAnimationFrame(animate);

renderer.render(scene,camera);

}

animate();


window.addEventListener("resize",function(){

camera.aspect = window.innerWidth/window.innerHeight;
camera.updateProjectionMatrix();
renderer.setSize(window.innerWidth,window.innerHeight);

});

</script>

</body>
</html>
